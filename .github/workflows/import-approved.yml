name: Import approved Smart Retail AI release
on:
  push:
    paths:
      - ".github/workflows/import-approved.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authorized repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Retrieve and verify approved release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_2vj4jy5DUb75jIsb3okPXuDoySx/69d21101-6db3-4d2d-8fcf-9fd1134f3d8a.gz' \
            --output /tmp/approved-release.tar.gz
          printf '%s  %s\n' \
            '78a822fad7ad9e333ffb02a287ca53f87629cb06fa6f51d71784f55bea2639e6' \
            '/tmp/approved-release.tar.gz' | sha256sum --check
          tar -xzf /tmp/approved-release.tar.gz
          test -f app/src/components/PresentationTour.tsx
          test -f app/public/assets/ads/bloom.mp4
          test -f app/src/routes/rewards.tsx
      - name: Commit the exact approved app and assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Smart Retail AI Release'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/ci.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'Import approved Smart Retail AI demo v5387d9f'
            git push origin HEAD:main
          fi
